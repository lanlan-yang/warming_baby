# 记忆归一化规则配置
# 仅用于去重判断，不改变原始存储内容
# 修改此文件后无需重启代码，下次添加记忆时自动重新加载
#
# 设计原则:
#   1. 归一化只影响"去重判断"，用户原始表述会被完整存储
#   2. FACT 类型同字段的新值会替换旧值（如用户改名后，新名字替换旧名字）
#   3. 不同字段的 FACT 记忆会共存（如姓名和住址互不影响）

# 字段定义: 用于 FACT 类型的替换判断
# 每个字段包含:
#   match_patterns:    识别该字段的正则模式列表 (re.search, 按从长到短排列)
#   normalize_patterns: 归一化规则，将匹配的表述统一为标准形式
#                       格式: [原始模式, 替换为] (用 str.replace, 按从长到短排列)
fields:
  name:
    # 姓名: "我叫小明" / "用户叫小明" → 归一化为 "用户叫小明"
    match_patterns:
      - "我的名字叫"
      - "我的名字是"
      - "我叫"
      - "用户叫"
    normalize_patterns:
      - ["我的名字叫", "用户叫"]
      - ["我的名字是", "用户叫"]
      - ["我叫", "用户叫"]

  birthday:
    # 生日: "我的生日是1月1日" / "我出生于2000年" → 归一化为 "用户生日是..."
    match_patterns:
      - "我的生日是"
      - "我的生日"
      - "我出生于"
      - "用户生日是"
      - "用户生日"
    normalize_patterns:
      - ["我的生日是", "用户生日是"]
      - ["我出生于", "用户生日是"]
      - ["我的生日", "用户生日是"]

  location:
    # 住址: "我住在成都" / "我家在成都" → 归一化为 "用户住在成都"
    match_patterns:
      - "我住在"
      - "我家在"
      - "用户住在"
      - "用户家在"
    normalize_patterns:
      - ["我家在", "用户住在"]
      - ["我住在", "用户住在"]
      - ["用户家在", "用户住在"]

  contact:
    # 联系方式: "我的电话是..." / "用户手机..." → 归一化为 "用户电话/手机/微信..."
    match_patterns:
      - "我的电话"
      - "我的手机"
      - "我的微信"
      - "用户电话"
      - "用户手机"
      - "用户微信"
    normalize_patterns:
      - ["我的电话", "用户电话"]
      - ["我的手机", "用户手机"]
      - ["我的微信", "用户微信"]

  allergy:
    # 过敏: "我对花生过敏" / "用户对花生过敏" → 归一化为 "用户对...过敏"
    match_patterns:
      - "我对.+?过敏"
      - "我.+?过敏"
      - "用户.+?过敏"
    normalize_patterns:
      - ["我对", "用户对"]

# 噪声词: 归一化时移除这些修饰词 (不影响语义判断)
# 这些词会让"其实我叫小明"和"我叫小明"归一化后一致
# FACT 和 PREFERENCE 归一化时都会移除这些词
noise_words:
  # 时间/状态
  - "其实"
  - "原来"
  - "本来"
  - "原本"
  - "以前"
  - "之前"
  - "后来"
  - "现在"
  - "刚才"
  - "突然"
  # 连词
  - "也"
  - "还"
  - "而且"
  - "并且"
  - "然后"
  - "还有"
  - "但是"
  # 程度副词
  - "特别"
  - "非常"
  - "真的"
  - "确实"
  - "有点"
  - "稍微"
  - "挺"
  - "蛮"
  - "一点"
  - "一些"
  - "经常"
  - "偶尔"
  - "总是"
  # 主语/自我 (注意: "用户"不在此列表中，因为 FACT 字段匹配需要保留"用户")
  - "我觉得"
  - "我认为"
  - "我想"
  - "可能"
  - "大概"
  - "应该"
  - "自己"

# ============================================================================
# PREFERENCE 类型配置
# ============================================================================
# 偏好归一化: 提取 (方向, 核心内容)
#   - 方向: like / dislike / unknown
#   - 核心内容: 去除方向词和噪声词后的内容 (如 "苹果"、"打篮球")
#
# 归一化结果:
#   "我喜欢苹果"    → "用户喜欢苹果"
#   "用户喜欢苹果"   → "用户喜欢苹果"  (归一化后相同，去重)
#   "我讨厌苹果"    → "用户不喜欢苹果" (同核心"苹果"，替换旧的)
#   "我喜欢香蕉"    → "用户喜欢香蕉"  (核心不同，共存)
#
# field 字段:
#   extract_field 返回核心内容 (如 "苹果")，用于 where 过滤同核心的偏好
#   方向变化 (like↔dislike) 会被 where 召回，走替换逻辑
preference:
  # 喜欢类关键词 (按从长到短排列，优先匹配长词避免误伤)
  like_keywords:
    - "非常喜欢"
    - "特别喜欢"
    - "真的喜欢"
    - "确实喜欢"
    - "非常爱"
    - "特别爱"
    - "真的爱"
    - "确实爱"
    - "爱吃"
    - "喜欢"
    - "爱"
    - "想"
    - "要"
    - "偏好"
    - "热爱"

  # 不喜欢类关键词 (按从长到短排列，优先匹配长词避免误伤)
  dislike_keywords:
    - "非常不喜欢"
    - "特别不喜欢"
    - "真的不喜欢"
    - "确实不喜欢"
    - "非常讨厌"
    - "特别讨厌"
    - "真的讨厌"
    - "确实讨厌"
    - "不喜欢"
    - "不爱"
    - "讨厌"
    - "恨"
    - "厌恶"
    - "反感"
